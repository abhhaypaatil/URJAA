version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: urjaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: urjaa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urjaa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urjaa-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/urjaa?sslmode=disable
      - JWT_SECRET=urjaa-production-jwt-secret-replace-in-real-deployment-32-chars-min
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=720h
      - FRONTEND_URL=http://localhost:5173
      - LOG_LEVEL=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urjaa-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
